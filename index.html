            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        header {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
        }

        .stats {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 15px;
            width: 60%;
            overflow: hidden;
        }

        .progress-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .day-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .day-card.completed {
            background-color: var(--secondary);
            color: white;
        }

        .day-card.completed .day-number, 
        .day-card.completed .checkbox {
            color: white;
        }

        .day-number {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .checkbox {
            width: 25px;
            height: 25px;
            border: 2px solid var(--primary);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .checkbox::after {
            content: '✓';
            color: var(--primary);
            display: none;
        }

        .day-card.completed .checkbox::after {
            display: block;
        }
        
        .day-card.completed .checkbox {
            border-color: white;
        }

        .notification-settings {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--accent);
            color: var(--text-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
            width: 100%;
        }
        
        .btn-reset {
            background-color: #d90429;
            color: white;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 80%;
            max-width: 300px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .close-modal {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 1rem;
        }

        .time-picker {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
        input, select {
            border: 1px solid var(--secondary);
            border-radius: 5px;
            padding: 5px;
            font-family: var(--font-family);
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>وِردي اليومي – سورة البقرة</h1>
    </header>

    <div class="container">
        <div class="stats">
            <div>
                <span>المكتمل: <span id="completed-count">0</span> / 30</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="grid" id="days-grid">
            <!-- سيتم إنشاء الأيام هنا بواسطة JavaScript -->
        </div>

        <div class="notification-settings" dir="rtl">
            <label for="reminder-time">⏰ ضبط التذكير اليومي:</label>
            <div class="time-picker">
                <input type="time" id="reminder-time" value="20:00">
                <button class="btn" style="width: auto; margin-top:0;" onclick="setupReminder()">تفعيل</button>
            </div>
            <p style="font-size: 0.8rem; color: #666; margin-top:10px;">(قد تحتاج إلى منح إذن للإشعارات على هاتفك)</p>
        </div>

        <button class="btn btn-reset" style="margin-top: 20px" onclick="resetChallenge()">🔄 إعادة بدء التحدي</button>
    </div>

    <div class="modal" id="message-modal">
        <div class="modal-content">
            <h2 id="modal-title">تهانينا!</h2>
            <p id="modal-text">رسالة تشجيعية هنا</p>
            <button class="close-modal" onclick="closeModal()">حسناً</button>
        </div>
    </div>

    <script>
        const totalDays = 30;
        const daysGrid = document.getElementById('days-grid');
        const completedCountEl = document.getElementById('completed-count');
        const progressFillEl = document.getElementById('progress-fill');
        const modal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');

        const messages = [
            'ما شاء الله! خطوة مباركة نحو النور. استمر.',
            'بارك الله فيك! وردك اليومي يرفع همتك.',
            'رائع! اقتربت خطوة جديدة من الختمة.',
            'يا بطل! واصل ولا تنقطع، القرآن ربيع قلبك.',
            'ممتاز! استشعر عظمة ما تقرأ اليوم.',
            'أحسنت! خطواتك في سورة البقرة تضيء حياتك.',
            'نور على نور! يوم إضافي وبداية جديدة.',
            'ما أجمل التزامك! الله يتقبل منك.',
            'همة عالية! لا تتوقف فالأجر عظيم.',
            'استمر يا بطل! البقرة بركة في الرزق والوقت.',
            'تبارك الله! قارئ القرآن في عليين.',
            'عمل عظيم! أتممت اليوم، فافرح بإنجازك.',
            'شكر الله سعيك! تذكر أن لكل حرف حسنة.',
            'بداية قوية ليوم جديد! واصل المسير.',
            'نصف الطريق تقريباً! أنت في حفظ الله.',
            'إنجاز رائع! داوم على هذا النور.',
            'عزيمة لا تلين! استمر في قراءة الوِرد.',
            'زادك الله نوراً! وفقك الله لكل خير.',
            'أنت رائع! كل يوم يمر يقربك من هدفك.',
            'ما شاء الله! استمر في جني الحسنات.',
            'خطوات مباركة! طهر قلبك بالقرآن.',
            'همة المؤمن لا تفتر! أحسنت اليوم.',
            'البقرة فسطاط القرآن! واصل الالتزام.',
            'وفقك الله! كل يوم تقرأه هو كنز لك.',
            'أوشكت على النهاية! استعد للنصر.',
            'قارب التحدي على الانتهاء! استمر.',
            'فخور بالتزامك! واصل حتى الختام.',
            'أيام قليلة وتختم التحدي! ثابر.',
            'ما أروع إنجازك! يوم واحد يفصلك.',
            'مبارك! أتممت الختمة بفضل الله وتوفيقه!'
        ];

        function createDays() {
            daysGrid.innerHTML = '';
            for (let i = 1; i <= totalDays; i++) {
                const dayCard = document.createElement('div');
                dayCard.classList.add('day-card');
                dayCard.id = `day-${i}`;
                dayCard.innerHTML = `
                    <div class="day-number">اليوم ${i}</div>
                    <div class="checkbox" onclick="toggleDay(${i})"></div>
                `;
                daysGrid.appendChild(dayCard);
            }
            loadProgress();
        }

        function toggleDay(day) {
            const dayCard = document.getElementById(`day-${day}`);
            dayCard.classList.toggle('completed');
            saveProgress();

            if (dayCard.classList.contains('completed')) {
                showModal(day);
            }
        }

        function saveProgress() {
            const completedDays = [];
            document.querySelectorAll('.day-card').forEach((card, index) => {
                if (card.classList.contains('completed')) {
                    completedDays.push(index + 1);
                }
            });
            localStorage.setItem('baqarahTracker', JSON.stringify(completedDays));
            updateStats(completedDays.length);
        }

        function loadProgress() {
            const saved = localStorage.getItem('baqarahTracker');
            const completedDays = saved ? JSON.parse(saved) : [];
            completedDays.forEach(day => {
                const dayCard = document.getElementById(`day-${day}`);
                if (dayCard) dayCard.classList.add('completed');
            });
            updateStats(completedDays.length);
        }

        function updateStats(completedCount) {
            completedCountEl.innerText = completedCount;
            const progress = (completedCount / totalDays) * 100;
            progressFillEl.style.width = `${progress}%`;
        }

        function showModal(day) {
            if (day === totalDays) {
                modalTitle.innerText = "🎉 مبارك الختام! 🎉";
                modalText.innerText = "لقد أتممت قراءة سورة البقرة كاملة لمدة 30 يوماً! نسأل الله أن يتقبل منك ويجعل القرآن نوراً لحياتك.";
            } else {
                modalTitle.innerText = "أحسنت! 🌿";
                modalText.innerText = messages[day - 1];
            }
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function resetChallenge() {
            if (confirm("هل أنت متأكد أنك تريد إعادة بدء التحدي ومسح جميع العلامات؟")) {
                localStorage.removeItem('baqarahTracker');
                createDays();
            }
        }

        function setupReminder() {
            const time = document.getElementById('reminder-time').value;
            if (!time) {
                alert("يرجى اختيار وقت أولاً.");
                return;
            }
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert(`تم تفعيل التذكير اليومي في الساعة ${time}.`);
                    } else if (permission === 'denied') {
                        alert("تم رفض إذن الإشعارات. يرجى تفعيلها من إعدادات المتصفح في هاتفك.");
                    }
                });
            } else {
                alert("المتصفح لا يدعم الإشعارات.");
            }
        }

        window.onload = createDays;
    </script>

    <!-- تسجيل الـ Service Worker لـ PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
                self.addEventListener('install', (e) => {
                    e.waitUntil(
                        caches.open('baqarah-v1').then((cache) => {
                            return cache.addAll(['/']);
                        })
                    );
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        caches.match(e.request).then((response) => {
                            return response || fetch(e.request);
                        })
                    );
                });
            `), { scope: '/' });
        }
    </script>

    <!-- ملف manifest.json مضمن -->
    <script type="application/json" id="manifest" style="display:none">
    {
      "name": "وِردي اليومي – سورة البقرة",
      "short_name": "وِردي البقرة",
      "icons": [
        {
          "src": "icon-192.png",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "icon-512.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ],
      "start_url": "./",
      "display": "fullscreen",
      "background_color": "#fefae0",
      "theme_color": "#3a5a40"
    }
    </script>
    <script>
        // تحميل المانيفست ديناميكياً
        const manifestString = document.getElementById('manifest').innerHTML;
        const blob = new Blob([manifestString], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.querySelector('#manifest').remove();
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);
    </script>
</body>
</html>

            'شكر الله سعيك! تذكر أن لكل حرف حسنة.',
            'بداية قوية ليوم جديد! واصل المسير.',
            'نصف الطريق تقريباً! أنت في حفظ الله.',
            'إنجاز رائع! داوم على هذا النور.',
            'عزيمة لا تلين! استمر في قراءة الوِرد.',
            'زادك الله نوراً! وفقك الله لكل خير.',
            'أنت رائع! كل يوم يمر يقربك من هدفك.',
            'ما شاء الله! استمر في جني الحسنات.',
            'خطوات مباركة! طهر قلبك بالقرآن.',
            'همة المؤمن لا تفتر! أحسنت اليوم.',
            'البقرة فسطاط القرآن! واصل الالتزام.',
            'وفقك الله! كل يوم تقرأه هو كنز لك.',
            'أوشكت على النهاية! استعد للنصر.',
            'قارب التحدي على الانتهاء! استمر.',
            'فخور بالتزامك! واصل حتى الختام.',
            'أيام قليلة وتختم التحدي! ثابر.',
            'ما أروع إنجازك! يوم واحد يفصلك.',
            'مبارك! أتممت الختمة بفضل الله وتوفيقه!'
        ];

        function createDays() {
            daysGrid.innerHTML = '';
            for (let i = 1; i <= totalDays; i++) {
                const dayCard = document.createElement('div');
                dayCard.classList.add('day-card');
                dayCard.id = `day-${i}`;
                dayCard.innerHTML = `
                    <div class="day-number">اليوم ${i}</div>
                    <div class="checkbox" onclick="toggleDay(${i})"></div>
                `;
                daysGrid.appendChild(dayCard);
            }
            loadProgress();
        }

        function toggleDay(day) {
            const dayCard = document.getElementById(`day-${day}`);
            dayCard.classList.toggle('completed');
            saveProgress();

            if (dayCard.classList.contains('completed')) {
                showModal(day);
            }
        }

        function saveProgress() {
            const completedDays = [];
            document.querySelectorAll('.day-card').forEach((card, index) => {
                if (card.classList.contains('completed')) {
                    completedDays.push(index + 1);
                }
            });
            localStorage.setItem('baqarahTracker', JSON.stringify(completedDays));
            updateStats(completedDays.length);
        }

        function loadProgress() {
            const saved = localStorage.getItem('baqarahTracker');
            const completedDays = saved ? JSON.parse(saved) : [];
            completedDays.forEach(day => {
                const dayCard = document.getElementById(`day-${day}`);
                if (dayCard) dayCard.classList.add('completed');
            });
            updateStats(completedDays.length);
        }

        function updateStats(completedCount) {
            completedCountEl.innerText = completedCount;
            const progress = (completedCount / totalDays) * 100;
            progressFillEl.style.width = `${progress}%`;
        }

        function showModal(day) {
            if (day === totalDays) {
                modalTitle.innerText = "🎉 مبارك الختام! 🎉";
                modalText.innerText = "لقد أتممت قراءة سورة البقرة كاملة لمدة 30 يوماً! نسأل الله أن يتقبل منك ويجعل القرآن نوراً لحياتك.";
            } else {
                modalTitle.innerText = "أحسنت! 🌿";
                modalText.innerText = messages[day - 1];
            }
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function resetChallenge() {
            if (confirm("هل أنت متأكد أنك تريد إعادة بدء التحدي ومسح جميع العلامات؟")) {
                localStorage.removeItem('baqarahTracker');
                createDays();
            }
        }

        function setupReminder() {
            const time = document.getElementById('reminder-time').value;
            if (!time) {
                alert("يرجى اختيار وقت أولاً.");
                return;
            }
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert(`تم تفعيل التذكير اليومي في الساعة ${time}.`);
                    } else if (permission === 'denied') {
                        alert("تم رفض إذن الإشعارات. يرجى تفعيلها من إعدادات المتصفح في هاتفك.");
                    }
                });
            } else {
                alert("المتصفح لا يدعم الإشعارات.");
            }
        }

        window.onload = createDays;
    </script>

    <!-- تسجيل الـ Service Worker لـ PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
                self.addEventListener('install', (e) => {
                    e.waitUntil(
                        caches.open('baqarah-v1').then((cache) => {
                            return cache.addAll(['/']);
                        })
                    );
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(
                        caches.match(e.request).then((response) => {
                            return response || fetch(e.request);
                        })
                    );
                });
            `), { scope: '/' });
        }
    </script>

    <!-- ملف manifest.json مضمن -->
    <script type="application/json" id="manifest" style="display:none">
    {
      "name": "وِردي اليومي – سورة البقرة",
      "short_name": "وِردي البقرة",
      "icons": [
        {
          "src": "icon-192.png",
          "sizes": "192x192",
          "type": "image/png"
        },
        {
          "src": "icon-512.png",
          "sizes": "512x512",
          "type": "image/png"
        }
      ],
      "start_url": "./",
      "display": "fullscreen",
      "background_color": "#fefae0",
      "theme_color": "#3a5a40"
    }
    </script>
    <script>
        // تحميل المانيفست ديناميكياً
        const manifestString = document.getElementById('manifest').innerHTML;
        const blob = new Blob([manifestString], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.querySelector('#manifest').remove();
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${manifestURL}">`);
    </script>
